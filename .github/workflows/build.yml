name: Сборка AnimeDub

# Собирается сама при каждом изменении кода; готовые exe и apk публикуются в Releases.
# Постоянные ссылки на последнюю сборку:
#   https://github.com/<владелец>/<репозиторий>/releases/latest/download/AnimeDub.exe
#   https://github.com/<владелец>/<репозиторий>/releases/latest/download/AnimeDub.apk
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["README.md", ".gitignore"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Проверка модулей
        run: python -c "import app, server, dub"

      - name: Установка PyInstaller
        run: pip install pyinstaller==6.11.1

      - name: Сборка exe
        run: pyinstaller --noconfirm --onefile --windowed --name AnimeDub --add-data "dub.py;." app.py

      - name: Упаковка в zip
        run: Compress-Archive -Path dist/AnimeDub.exe -DestinationPath dist/AnimeDub.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/AnimeDub.exe
            dist/AnimeDub.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Сборка apk
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Переименование
        run: mkdir -p dist && cp android/app/build/outputs/apk/release/app-release.apk dist/AnimeDub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/AnimeDub.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Сборка {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          body: "Автосборка из ветки `${{ github.ref_name }}`, коммит ${{ github.sha }}."
          make_latest: true
          files: |
            dist/AnimeDub.exe
            dist/AnimeDub.zip
            dist/AnimeDub.apk
